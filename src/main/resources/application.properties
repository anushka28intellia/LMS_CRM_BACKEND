server.servlet.context-path=/api
server.port=8081
server.forward-headers-strategy=FRAMEWORK
spring.application.name=CRM Backend

spring.profiles.active=local

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n
logging.file.name=logs/crm.log
logging.file.path=logs
logging.logback.rollingpolicy.file-name-pattern=logs/crm-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Records module (com.its.crm.records: Persons, Entities, custom fields, metadata, list views, audit)
# "Today" for relative-date filters and formulas such as LinkedIn Connect Age (Weeks).
crm.time-zone=Australia/Sydney
# Dev users (X-Dev-User header, seeded users u1-u4) until Cognito sign-in is wired. Off unless switched on locally;
# when on, the records endpoints skip the JWT check (see com.its.crm.config.SecurityConfig).
crm.auth.dev-users=${CRM_DEV_USERS:false}

# Hypersistence JsonType (Hibernate 7) is Jackson 3 only; this mapper keeps the com.its.crm Jackson 2 JsonNode
# JSONB fields (pipeline steps, task form data) stored as their real JSON content.
hypersistence.utils.jackson.object.mapper=com.its.crm.config.HypersistenceJsonMapperSupplier
