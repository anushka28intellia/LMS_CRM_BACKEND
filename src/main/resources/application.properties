server.servlet.context-path=/api
server.port=8081
server.forward-headers-strategy=FRAMEWORK
spring.application.name=CRM Backend

spring.profiles.active=local

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n
logging.file.name=logs/crm.log
logging.file.path=logs
logging.logback.rollingpolicy.file-name-pattern=logs/crm-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-file-size=10MB

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
