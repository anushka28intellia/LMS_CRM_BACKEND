# Tests run against a throwaway database: ApiTestBase DROPS and rebuilds its "public" schema once per run.
# Never point TEST_DB_URL (or SPRING_DATASOURCE_URL, which overrides it) at a database whose data you need.
# Create the default once with: CREATE DATABASE crm_backend_test;
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/crm_backend_test}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=false
crm.cors.allowed-origins=http://localhost:*
crm.auth.dev-users=true
